# Resource allocation for bioinformatics tools
# Organized in pipeline execution order
# Adjust threads and memory based on your hardware availability

# Step 1: Read trimming and orientation
pychopper:
  threads: 20
  memory_gb: 32

# Used throughout pipeline for BAM/FASTQ conversions and sorting
samtools:
  threads: 20
  memory_gb: 32

# Step 2: Genome alignment
minimap2:
  threads: 20
  memory_gb: 32

# Step 3: Transcript assembly
stringtie:
  threads: 20
  memory_gb: 32

isoquant:
  threads: 20
  memory_gb: 32

# Step 4: Transcript merging
merge:
  threads: 20
  memory_gb: 64