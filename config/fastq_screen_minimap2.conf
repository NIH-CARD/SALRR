# FastQ Screen Configuration File
# Using minimap2 aligner for ONT long reads
# NOTE: DATABASE paths must be base names (without .mmi extension).
# fastq_screen validates each database by checking for <base>.fa or <base>.fa.gz,
# then uses <base>.mmi for alignment.
#
# Generated for NIA CARD Long-read RNA-seq Pipeline
# Screens against 7 databases: Human, Mouse, E. coli, PhiX, Yeast, rRNA, SIRV

#################
## Minimap2     #
#################
# FastQ Screen will use minimap2 as the aligner (specified via --aligner minimap2)
# The MINIMAP2 path can be set here if not in $PATH
#MINIMAP2 /path/to/minimap2


##############
## Databases #
##############

#You can change these database paths to your own indices paths

# Human (GRCh38 no-alt analysis set)
DATABASE    Human   /data/CARD_AUX/LRS_temp/NABEC_RNA/REFERENCES/fastq_screen_indices/GRCh38/Human_GRCh38

# Mouse (GRCm38)
# DATABASE    Mouse   /data/CARD_AUX/LRS_temp/NABEC_RNA/REFERENCES/fastq_screen_indices/GRCm38/Mouse_GRCm38

# E. coli (K-12 MG1655)
DATABASE    Ecoli   /data/CARD_AUX/LRS_temp/NABEC_RNA/REFERENCES/fastq_screen_indices/Ecoli/Ecoli_K12

# PhiX (Illumina spike-in control)
# DATABASE    PhiX    /data/CARD_AUX/LRS_temp/NABEC_RNA/REFERENCES/fastq_screen_indices/PhiX/PhiX

# Yeast (S. cerevisiae)
DATABASE    Yeast   /data/CARD_AUX/LRS_temp/NABEC_RNA/REFERENCES/fastq_screen_indices/sacCer3/Yeast_sacCer3

# Human rRNA (45S, 5S, mitochondrial 12S/16S)
DATABASE    rRNA    /data/CARD_AUX/LRS_temp/NABEC_RNA/REFERENCES/fastq_screen_indices/rRNA/Human_rRNA

# SIRV RNA spike-in controls (Lexogen SIRV Set4 + ERCC)
DATABASE    SIRV    /data/CARD_AUX/LRS_temp/NABEC_RNA/REFERENCES/fastq_screen_indices/SIRVSet4/SIRV
